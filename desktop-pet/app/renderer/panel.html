<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>撫子 控制面板</title>
<style>
  :root {
    --ink: #4a2d14; --muted: #7d5a3a; --line: rgba(120, 72, 24, .38); --accent: #a5581f; --accent-ink: #fff8ea;
    --chip: rgba(255, 246, 222, .55); --card: rgba(255, 248, 230, .32);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { color: var(--ink); font: 13px/1.5 "Microsoft JhengHei UI", "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
    user-select: none; -webkit-user-select: none; }
  /* 羊皮紙卷軸當底，內容只放在紙面範圍內 */
  #scroll { position: relative; width: 100vw; height: 100vh; background: url("../assets/parchment.png") center / 100% 100% no-repeat; }
  #drag { position: absolute; left: 6%; right: 6%; top: 0; height: 12%; -webkit-app-region: drag; }
  #close { position: absolute; right: 19%; top: 13.2%; z-index: 2; width: 24px; height: 24px; padding: 0; text-align: center;
    border-radius: 50%; line-height: 22px; font-size: 14px; background: var(--chip); }
  #page { position: absolute; left: 17.9%; right: 17%; top: 12.9%; bottom: 12.6%; overflow-y: auto; padding: 4px 6px 4px 2px; }
  #page::-webkit-scrollbar { width: 6px; }
  #page::-webkit-scrollbar-thumb { background: rgba(120, 72, 24, .45); border-radius: 3px; }
  h1 { font: 700 20px/1.3 "Noto Serif TC", "PMingLiU", "Songti TC", serif; margin: 0 0 8px; text-align: center; letter-spacing: .12em; }
  h2 { font: 700 13px/1.3 "Noto Serif TC", "PMingLiU", "Songti TC", serif; margin: 0 0 8px; color: var(--muted); }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 10px; margin-bottom: 10px; }
  .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .row label { flex: 1; }
  input[type=range] { flex: 2; accent-color: var(--accent); }
  output { min-width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  button { border: 1px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 5px;
    padding: 5px 7px; font: inherit; cursor: pointer; text-align: left; -webkit-app-region: no-drag; }
  button:hover { border-color: var(--accent); background: rgba(255, 250, 235, .85); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.on { outline: 2px solid var(--accent); }
  .hint { color: var(--muted); font-size: 12px; margin: 4px 0 0; }
  pre { background: var(--chip); border-radius: 5px; padding: 8px; font-size: 11px; max-height: 120px; overflow: auto; margin: 6px 0 0; white-space: pre-wrap; user-select: text; }
  .vline { border-top: 1px dashed var(--line); padding-top: 8px; margin-top: 8px; }
  .vline:first-of-type { border-top: 0; padding-top: 0; margin-top: 4px; }
  .vline h3 { margin: 0 0 4px; font-size: 12px; color: var(--muted); }
  .vline input[type=text], #v-url, #v-name, select { width: 100%; border: 1px solid var(--line); background: var(--chip); color: var(--ink);
    border-radius: 5px; padding: 4px 6px; font: inherit; user-select: text; -webkit-user-select: text; }
  .vline .f { display: grid; grid-template-columns: 4.2em 1fr; gap: 4px 6px; align-items: center; margin: 3px 0; }
  .vline .f input[type=number] { width: 4.5em; border: 1px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 5px; padding: 3px 4px; font: inherit; }
  .vline .btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .takes { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
  .take { display: flex; align-items: center; gap: 6px; }
  .take .ms { color: var(--muted); font-size: 12px; min-width: 4.5em; }
  .take .warn { color: #a23a1a; font-size: 12px; }
  .vmsg { font-size: 12px; margin: 4px 0 0; min-height: 1.4em; }
  .vmsg.err { color: #a23a1a; }
  label.check { display: flex; gap: 6px; align-items: center; }
</style>
</head>
<body>
<div id="scroll">
<div id="drag"></div>
<button id="close" title="關閉">✕</button>
<div id="page">
  <h1>撫子 控制面板</h1>

  <section>
    <h2>外觀</h2>
    <div class="row"><label for="size">尺寸</label><input id="size" type="range" step="5"><output id="size-out"></output></div>
    <div class="row"><label for="bubbleScale">字大小</label><input id="bubbleScale" type="range" min="70" max="220" step="10"><output id="bubbleScale-out"></output></div>
    <div class="row"><label for="walkStyle">走路動作</label><select id="walkStyle" style="flex:2"><option value="video">影片版（新）</option><option value="classic">22 系列（逐張）</option></select></div>
    <div class="row"><label for="volume">音量</label><input id="volume" type="range" min="0" max="100" step="5"><output id="volume-out"></output></div>
    <p class="hint">也可以在撫子身上按住 Ctrl 滾動滑鼠滾輪縮放。她被蓋住或拎不起來時，按 Ctrl+Alt+N 喚醒。</p>
    <div class="grid" id="toggles"></div>
  </section>

  <section>
    <h2>語音工作室（改台詞、生成、試聽，滿意再採用）</h2>
    <div class="row"><label for="v-key">狀態</label><select id="v-key"></select></div>
    <div id="v-lines"></div>
    <details style="margin-top:8px"><summary>Breeze 設定</summary>
      <div class="vline"><div class="f"><label for="v-url">位置</label><input id="v-url" type="text"></div>
      <div class="f"><label for="v-name">聲音</label><input id="v-name" type="text"></div></div>
    </details>
    <p class="hint">「生成」只做試聽檔，不會動到正式檔；按「採用」才會改台詞表並換掉那一句的音檔，撫子立刻生效。試聽音量跟著上面的音量。</p>
  </section>

  <section>
    <h2>用量門檻</h2>
    <div class="row"><label for="tiredAt">疲憊（5h 或 7d 用量 ≥）</label><input id="tiredAt" type="range" min="50" max="99"><output id="tiredAt-out"></output></div>
    <div class="row"><label for="faintAt">暈倒（7d 用量 ≥）</label><input id="faintAt" type="range" min="80" max="100"><output id="faintAt-out"></output></div>
    <div class="row"><label for="napAt">睡覺（5h 用量 ≥）</label><input id="napAt" type="range" min="80" max="100"><output id="napAt-out"></output></div>
  </section>

  <section>
    <h2>測試狀態（直接切，不經過 Claude）</h2>
    <div class="grid" id="force"></div>
  </section>

  <section>
    <h2>模擬器（假裝 Claude Code 送事件，走跟真的 hooks 同一條路）</h2>
    <div class="grid" id="sim"></div>
    <div class="row"><label for="u5">5 小時用量</label><input id="u5" type="range" min="0" max="100" value="30"><output id="u5-out">30%</output></div>
    <div class="row"><label for="u7">7 天用量</label><input id="u7" type="range" min="0" max="100" value="40"><output id="u7-out">40%</output></div>
    <div class="grid">
      <button class="primary" id="send-usage">送出用量</button>
      <button id="clear">清除模擬資料</button>
    </div>
    <pre id="snap"></pre>
    <p class="hint" id="dir"></p>
  </section>

  <section>
    <h2>動作</h2>
    <div class="grid" id="actions"></div>
  </section>
</div>
</div>
  <script src="panel.js"></script>
</body>
</html>
